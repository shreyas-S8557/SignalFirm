version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn scrapegraph_worker.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./scrapegraph_jobs.db:/app/scrapegraph_jobs.db
      # Mount your actual Scrapegraph repo checkout so the worker can shell
      # out to its CLI pipeline (see scrapegraph_worker/scrape_adapter.py).
      - ${SCRAPEGRAPH_REPO_PATH:-../Scrapegraph}:/scrapegraph
    depends_on:
      - redis

  worker:
    build: .
    command: python -m scrapegraph_worker.worker_main
    env_file: .env
    volumes:
      - ./scrapegraph_jobs.db:/app/scrapegraph_jobs.db
      - ${SCRAPEGRAPH_REPO_PATH:-../Scrapegraph}:/scrapegraph
    depends_on:
      - redis

  enrichment-scheduler:
    build: .
    command: python -m scrapegraph_worker.enrichment_scheduler_main
    env_file: .env
    # No-ops immediately unless ENRICHMENT_SCHEDULE_ENABLED=true (see
    # .env.example) -- an unattended crawl sweep is opt-in. When enabled,
    # sweeps companies due for enrichment at ENRICHMENT_SCHEDULE_HOUR:
    # ENRICHMENT_SCHEDULE_MINUTE every day. Doesn't touch Redis/the scrape
    # queue -- it enriches in-process on its own schedule, same as
    # recommendations-scheduler below -- so no `depends_on` here either.
    volumes:
      - ./scrapegraph_jobs.db:/app/scrapegraph_jobs.db

  recommendations-scheduler:
    build: .
    command: python -m scrapegraph_worker.recommendations_scheduler_main
    env_file: .env
    # Fires the Recommendation Engine's daily digest at DIGEST_SCHEDULE_HOUR:
    # DIGEST_SCHEDULE_MINUTE (DIGEST_TIMEZONE) every day -- see
    # scrapegraph_worker/recommendations/ and .env.example's DIGEST_* vars.
    # Doesn't touch Redis/the scrape queue at all, so it has no `depends_on`
    # here; it only talks to Twenty's REST API and (optionally) SMTP/Slack.
    volumes:
      # Only ever written to if neither DIGEST_EMAIL_TO nor
      # DIGEST_SLACK_WEBHOOK_URL is set (see recommendations/delivery.py) --
      # mounted so that fallback case is still visible on the host.
      - ./daily_digest.md:/app/daily_digest.md

  outbound-scheduler:
    build: .
    command: python -m scrapegraph_worker.outbound_scheduler_main
    env_file: .env
    # Daily sweep for due follow-up-sequence steps (see outbound/sequence.py
    # and outbound_scheduler_main.py's own docstring). Sends real email only
    # if OUTBOUND_AUTO_SEND_EMAIL=true; every other channel is always
    # queued for a human regardless of this container running.
    volumes:
      - ./scrapegraph_jobs.db:/app/scrapegraph_jobs.db
