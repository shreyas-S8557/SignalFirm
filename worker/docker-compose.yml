version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn scrapegraph_worker.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./scrapegraph_jobs.db:/app/scrapegraph_jobs.db
      # Mount your actual Scrapegraph repo checkout so the worker can shell
      # out to its CLI pipeline (see scrapegraph_worker/scrape_adapter.py).
      - ${SCRAPEGRAPH_REPO_PATH:-../Scrapegraph}:/scrapegraph
    depends_on:
      - redis

  worker:
    build: .
    command: python -m scrapegraph_worker.worker_main
    env_file: .env
    volumes:
      - ./scrapegraph_jobs.db:/app/scrapegraph_jobs.db
      - ${SCRAPEGRAPH_REPO_PATH:-../Scrapegraph}:/scrapegraph
    depends_on:
      - redis

  recommendations-scheduler:
    build: .
    command: python -m scrapegraph_worker.recommendations_scheduler_main
    env_file: .env
    # Fires the Recommendation Engine's daily digest at DIGEST_SCHEDULE_HOUR:
    # DIGEST_SCHEDULE_MINUTE (DIGEST_TIMEZONE) every day -- see
    # scrapegraph_worker/recommendations/ and .env.example's DIGEST_* vars.
    # Doesn't touch Redis/the scrape queue at all, so it has no `depends_on`
    # here; it only talks to Twenty's REST API and (optionally) SMTP/Slack.
    volumes:
      # Only ever written to if neither DIGEST_EMAIL_TO nor
      # DIGEST_SLACK_WEBHOOK_URL is set (see recommendations/delivery.py) --
      # mounted so that fallback case is still visible on the host.
      - ./daily_digest.md:/app/daily_digest.md
