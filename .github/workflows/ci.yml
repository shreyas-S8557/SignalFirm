name: CI

# Phase 9 -- Production Readiness. Runs on every push/PR touching the
# worker or frontend, plus main so the badge always reflects main's real
# state. Three independent jobs (lint, test, docker-build) run in parallel
# rather than one long sequential job, so a lint failure doesn't hide
# behind a slow test run, and vice versa.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

defaults:
  run:
    working-directory: worker

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r requirements.txt
      - name: ruff check
        run: ruff check scrapegraph_worker tests
      # Deliberately no `ruff format --check` here: this codebase predates
      # ruff, and reformatting ~10k existing lines is its own separate,
      # reviewable change (see pyproject.toml's comment) rather than
      # something to fold silently into Phase 9. Add it once that
      # reformat has actually happened.

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r requirements.txt
      # No live Twenty instance, Redis, or LLM key in CI -- every test in
      # this suite is designed to run fully offline against FakeTwentyClient
      # / FakeLLMClient (see tests/conftest.py's own docstring), so nothing
      # extra needs to be stood up here.
      - name: pytest
        run: pytest --cov=scrapegraph_worker --cov-report=term-missing --cov-report=xml -v
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: worker/coverage.xml
          retention-days: 14

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        run: docker build -t opika-crm-sync-worker:ci .
        working-directory: worker
      # Not pushed anywhere from this workflow -- publishing to a registry
      # is a deployment-target decision (see worker/README.md's Production
      # Readiness section) left to a separate, environment-specific
      # workflow rather than assumed here.

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
